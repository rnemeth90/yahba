# Entry-point nginx.conf for local keepalive testing.
#
# Loads the same four modules as production, inherits the real events config
# and all http tuning from production http.conf, but skips:
#   - mgmt {}          (nginx-plus / NGINX Agent only)
#   - keyval_zone      (nginx-plus only)
#   - internal DNS     (unreachable outside the corporate network)
#   - upstreams        (point to internal infrastructure)
#   - server vhosts    (replaced with a simple echo server)
#
# The full config tree from:
#   ~/repos/aprimo/marketingoperations/nginx/nginx
# is mounted read-only at /etc/nginx so that include paths resolve correctly.

load_module /var/nginx/modules/ngx_http_headers_more_filter_module.so;
load_module /var/nginx/modules/ngx_http_js_module.so;
load_module /var/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /var/nginx/modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 10240;

include /etc/nginx/events/events.conf;

http {
    # ── Hash tuning (from production http.conf) ───────────────────────────────
    variables_hash_bucket_size  256;
    server_names_hash_max_size  2048;
    server_names_hash_bucket_size 256;
    proxy_headers_hash_bucket_size 128;
    map_hash_bucket_size        256;
    client_max_body_size        0;
    large_client_header_buffers 4 16k;

    # ── TLS session cache (from production) ───────────────────────────────────
    ssl_session_cache   shared:ssl-session-cache:60m;
    ssl_session_timeout 4h;

    # ── Keepalive settings (from production http.conf) ────────────────────────
    keepalive_timeout  300s;
    keepalive_requests 1000;

    # ── Mime types ─────────────────────────────────────────────────────────────
    include /etc/nginx/http/mime-types.conf;

    # ── NJS scripts (loaded but not wired to js_set here) ────────────────────
    js_path /etc/nginx/njs_modules;

    # ── Log format: shows connection serial and reqs per connection ───────────
    # conn=N  — TCP connection serial number (same N = same keepalive connection)
    # reqs=M  — requests served on that connection (M > 1 = keepalive reuse)
    log_format keepalive '$remote_addr [$time_local] '
                         '"$request" $status '
                         'conn=$connection reqs=$connection_requests';
    access_log /var/log/nginx/access.log keepalive;

    # ── Header cleanup (from production) ─────────────────────────────────────
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers X-Powered-By;

    # ── Test server ───────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
